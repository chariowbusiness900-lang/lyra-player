[package]
name = "lyra"
version = "1.0.0"
description = "Lyra — Lecteur de musique Fluent pour Windows 11"
authors = ["Lyra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
notify = "8"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
