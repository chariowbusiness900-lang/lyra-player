name: Build Lyra (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        shell: pwsh
        run: ./scripts/gen-icon.ps1

      - name: Install Tauri CLI (binaire précompilé)
        run: npm install --global @tauri-apps/cli@^2

      - name: Build (release, sans empaquetage)
        working-directory: src-tauri
        run: tauri build --no-bundle

      - name: Locate signtool
        id: signtool
        shell: pwsh
        run: |
          $candidates = @()
          $candidates += Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -ExpandProperty FullName
          $onPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ($onPath) { $candidates += $onPath }
          $signtool = $candidates | Where-Object { $_ } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable sur ce runner" }
          "path=$signtool" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "signtool utilise : $signtool"

      - name: Prepare certificate
        id: cert
        shell: pwsh
        env:
          LYRA_PFX_BASE64: ${{ secrets.LYRA_PFX_BASE64 }}
          LYRA_PFX_PASSWORD: ${{ secrets.LYRA_PFX_PASSWORD }}
        run: |
          if ($env:LYRA_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$PWD\lyra.pfx", [Convert]::FromBase64String($env:LYRA_PFX_BASE64))
            "pass=$env:LYRA_PFX_PASSWORD" | Add-Content $env:GITHUB_OUTPUT
            Write-Host "Certificat fourni via les secrets GitHub."
          } else {
            $pass = "Lyra$(Get-Random)!"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Lyra Player, O=Lyra" -KeyUsage DigitalSignature -FriendlyName "Lyra Code Signing" -CertStoreLocation "Cert:\CurrentUser\My"
            Export-PfxCertificate -Cert $cert -FilePath "$PWD\lyra.pfx" -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
            Export-Certificate -Cert $cert -FilePath "$PWD\lyra-codesign.cer" | Out-Null
            "pass=$pass" | Add-Content $env:GITHUB_OUTPUT
            Write-Host "Certificat auto-signe ephemere : Windows affichera un editeur inconnu tant que le .cer nest pas installe."
          }

      - name: Sign application
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
          PFX_PASSWORD: ${{ steps.cert.outputs.pass }}
        run: ./scripts/sign.ps1 -Files "src-tauri\target\release\lyra.exe"

      # L'installateur NSIS embarque l'exe : il doit donc etre signe AVANT l'empaquetage.
      - name: Bundle installer (NSIS)
        working-directory: src-tauri
        run: tauri build --bundles nsis

      - name: Sign installer
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
          PFX_PASSWORD: ${{ steps.cert.outputs.pass }}
        run: |
          $files = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | ForEach-Object { $_.FullName }
          if (-not $files) { throw "Aucun installateur NSIS genere" }
          ./scripts/sign.ps1 -Files $files

      - name: Verify signatures
        shell: pwsh
        run: |
          $targets = @("src-tauri\target\release\lyra.exe") + (Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | ForEach-Object { $_.FullName })
          $missing = 0
          foreach ($f in $targets) {
            $sig = Get-AuthenticodeSignature $f
            $who = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "aucun" }
            Write-Host ("{0} : {1} ({2})" -f (Split-Path $f -Leaf), $sig.Status, $who)
            if (-not $sig.SignerCertificate) { $missing++ }
          }
          if ($missing -gt 0) { throw "Signature absente sur $missing fichier(s)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyra-windows
          path: |
            src-tauri/target/release/lyra.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("src-tauri\target\release\lyra.exe") +
                   (Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | ForEach-Object { $_.FullName })
          if (Test-Path "lyra-codesign.cer") { $files += (Resolve-Path "lyra-codesign.cer").Path }
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existante : mise a jour des fichiers (--clobber)."
            gh release upload $tag $files --clobber
            gh release edit $tag --draft=false --title "Lyra $tag"
          } else {
            Write-Host "Création de la release $tag."
            gh release create $tag $files --generate-notes --title "Lyra $tag"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
